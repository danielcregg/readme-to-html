<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub README to HTML</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        #output {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 20px;
        }

        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <h1>GitHub README to HTML</h1>
    <p>Prepend your standard GitHub README URL with this server's address to view it as HTML.</p>
    <p><b>Example:</b> If the README URL is
        <code>https://github.com/torvalds/linux/blob/master/README.md</code>, use
        <code>{your-server}/https://github.com/torvalds/linux/blob/master/README.md</code>
    </p>
    <div id="output"></div>
</body>

</html>
